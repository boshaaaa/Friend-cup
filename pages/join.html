<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Tournament</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


    <nav>

        <div class="logo">

            🏆 Friend Cup

        </div>


        <div class="nav-links">

            <a href="../index.html">
                🏠 Home
            </a>

            <a href="tournaments.html">
                🏆 Tournaments
            </a>

            <a href="login.html">
                🔐 Login
            </a>

        </div>

    </nav>



    <main class="joinPage">


        <div class="joinCard">

            <div class="joinIcon">

                🏆

            </div>


            <h1>

                Join Tournament

            </h1>


            <p>

                Enter your name to join

            </p>


            <h2 id="tournamentName">

                Tournament

            </h2>


            <input
                type="text"
                id="playerName"
                placeholder="Player Name"
                autocomplete="off"
            >


            <button
                id="joinButton"
                class="joinMainBtn"
            >

                JOIN TOURNAMENT

            </button>


            <p
                id="joinMessage"
                class="joinMessage"
            ></p>


            <a
                href="tournaments.html"
                class="backBtn"
            >

                ⬅ Back To Tournaments

            </a>

        </div>


    </main>


    <script src="../join.js"></script>

</body>

</html>
