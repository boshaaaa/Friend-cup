<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friend Cup - Register</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">

            🏆 Friend Cup

        </div>


        <div class="nav-links">

            <a href="../index.html">
                🏠 Home
            </a>

            <a href="tournaments.html">
                🏆 Tournaments
            </a>

            <a href="login.html">
                🔐 Login
            </a>

        </div>

    </nav>



    <!-- Register -->

    <main class="loginPage">


        <div class="loginCard">


            <div class="loginIcon">

                📝

            </div>


            <h1>

                Create Account

            </h1>


            <p>

                Join Friend Cup today!

            </p>


            <input
                type="text"
                id="registerUsername"
                placeholder="Username"
                autocomplete="username"
            >


            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                autocomplete="new-password"
            >


            <input
                type="password"
                id="registerConfirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >


            <button
                id="registerButton"
                class="loginBtn"
            >

                REGISTER

            </button>


            <p
                id="registerMessage"
                class="loginMessage"
            ></p>


            <p class="registerText">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>


        </div>


    </main>


    <script src="../register.js"></script>

</body>

</html>
