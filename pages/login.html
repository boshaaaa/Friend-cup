<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friend Cup - Login</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">

            🏆 Friend Cup

        </div>


        <div class="nav-links">

            <a href="../index.html">
                🏠 Home
            </a>

            <a href="tournaments.html">
                🏆 Tournaments
            </a>

            <a href="login.html">
                🔐 Login
            </a>

        </div>

    </nav>



    <!-- Login -->

    <main class="loginPage">


        <div class="loginCard">


            <div class="loginIcon">

                🔐

            </div>


            <h1>

                Welcome Back

            </h1>


            <p>

                Login to your Friend Cup account

            </p>


            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                autocomplete="username"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button
                id="loginButton"
                class="loginBtn"
            >

                LOGIN

            </button>


            <p
                id="loginMessage"
                class="loginMessage"
            ></p>


            <p class="registerText">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>


        </div>


    </main>


    <script src="../login.js"></script>

</body>

</html>
