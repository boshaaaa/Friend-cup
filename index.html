<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friend Cup</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">

            🏆 Friend Cup

        </div>


        <div class="nav-links">

            <a href="index.html">

                🏠 Home

            </a>


            <a href="pages/tournaments.html">

                🏆 Tournaments

            </a>


            <a href="#players">

                👥 Players

            </a>


            <!-- Login / User -->

            <div id="authArea">

                <a href="pages/login.html">

                    🔐 Login

                </a>

            </div>

        </div>

    </nav>



    <!-- Hero Section -->

    <main>

        <section class="hero">

            <h1>

                Welcome To Friend Cup 🏆

            </h1>


            <p>

                Create tournaments and challenge
                your friends.

            </p>


            <button
                onclick="location.href='#createTournament'"
            >

                Create Tournament

            </button>

        </section>



        <!-- Create Tournament -->

        <section
            id="createTournament"
            class="createSection"
        >

            <h2>

                Create Tournament

            </h2>


            <form id="tournamentForm">


                <input
                    type="text"
                    id="tournamentName"
                    placeholder="Tournament Name"
                    required
                >


                <input
                    type="text"
                    id="gameName"
                    placeholder="Game Name"
                    required
                >


                <input
                    type="number"
                    id="players"
                    placeholder="Players Limit"
                    min="4"
                    required
                >


                <button type="submit">

                    Create

                </button>


            </form>

        </section>



        <!-- Created Tournaments -->

        <section
            id="tournaments"
            class="createdTournaments"
        >

            <h2>

                🏆 Created Tournaments

            </h2>


            <div id="tournamentList"></div>

        </section>


        <!-- Players -->

        <section id="players">

            <h2>

                👥 Players

            </h2>

        </section>

    </main>



    <!-- Existing Tournament Script -->

    <script src="script.js"></script>


    <!-- Authentication Script -->

    <script src="userAuth.js"></script>

</body>

</html>
